name: WebUntis Sync

on:
  schedule:
    # Mo - Fr alle 10 Minuten während Schulzeit (06:00 - 17:00 CET / 05:00 - 16:00 UTC)
    - cron: '*/10 5-16 * * 1-5'
    # Abends für Änderungen am Folgetag (19:00, 21:00 CET / 18:00, 20:00 UTC)
    - cron: '0 18,20 * * 1-5'
    # Sonntagabend für Montag-Vorbereitung (19:00, 21:00 CET / 18:00, 20:00 UTC)
    - cron: '0 18,20 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - env:
          UNTIS_SERVER: ${{ secrets.UNTIS_SERVER }}
          UNTIS_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python sync.py
